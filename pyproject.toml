[project]
name = "apex-zero"
version = "0.0.1"
description = "RL agent that learns to drive real F1 circuits rebuilt from telemetry, and races ghosts of real laps."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.4",
    "fastf1>=3.4",
    "httpx>=0.27",
    "trimesh>=4.4",
    "pygltflib>=1.16",
    "matplotlib>=3.9",
    "gymnasium>=1.0",
    # Default: PyPI wheel (CUDA 13 build on Linux, CPU/MPS on macOS; runs fine without a GPU).
    # `--extra cpu`: small CPU-only wheel (CI). `--extra gpu`: explicit CUDA 13.0 index.
    # Pinned to one minor release so every variant is the same torch version.
    "torch>=2.14,<2.15",
    "tensorboard>=2.17",
]

[project.optional-dependencies]
# CPU-only torch wheels (no CUDA libraries). Used by CI.
cpu = ["torch>=2.14,<2.15"]
# CUDA 13.0 torch wheels from the PyTorch index.
gpu = ["torch>=2.14,<2.15"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
]
wandb = ["wandb>=0.18"]

[project.scripts]
apex = "apex_zero.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apex_zero"]

# --- torch wheel selection ---------------------------------------------------
# uv cannot make "CPU unless --extra gpu" the default, so the default is PyPI torch and the
# `cpu` / `gpu` extras (mutually exclusive) pick a specific PyTorch index. Note that plain
# `uv run` re-syncs the no-extra resolution; after `uv sync --extra cpu|gpu` use
# `uv run --no-sync ...` (or set UV_NO_SYNC=1, as CI does) to keep that torch build.
[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", extra = "gpu" },
    { index = "pytorch-cpu", extra = "cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# --- tooling -----------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["viewer", "data", "runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "NPY"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI options as default values; they are evaluated once, by design.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.isort]
known-first-party = ["apex_zero"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
mypy_path = "src"
warn_unreachable = true

[[tool.mypy.overrides]]
# Third-party packages without type information.
module = ["fastf1.*", "trimesh.*", "pygltflib.*", "gymnasium.*", "tensorboard.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "slow: integration tests that take more than a few seconds (full track build, QSS lap)",
    "gpu: requires CUDA (batched sim parity, training smoke)",
    "network: hits live FastF1/OpenF1 endpoints; never run in CI",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["apex_zero"]
branch = true
